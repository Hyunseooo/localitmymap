<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리동네 취향 지도</title>
  
  <!-- 카카오맵 JavaScript API 불러오기 (services 라이브러리 포함) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b3c1b3d89c3faba562c87e2765978f03&libraries=services"></script>

  <style>
    /* 기본 리셋 CSS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      overflow: hidden;
    }

    /* 메인 화면 1:3 스플릿 레이아웃 */
    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 왼쪽 사이드바 영역 */
    .sidebar {
      flex: 1;
      min-width: 280px;
      max-width: 360px;
      background-color: #f8f9fa;
      border-right: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    /* 사이드바 헤더 타이틀 */
    .sidebar-header {
      padding: 16px;
      background-color: #ffeb00;
      font-weight: bold;
      font-size: 1.1rem;
      color: #3c1e1e;
      text-align: center;
    }

    /* 카테고리 탭 영역 */
    .tabs {
      display: flex;
      background-color: #ffffff;
      border-bottom: 1px solid #dee2e6;
    }

    .tab-button {
      flex: 1;
      padding: 12px 0;
      border: none;
      background-color: #ffffff;
      cursor: pointer;
      font-size: 0.9rem;
      color: #495057;
      transition: all 0.2s ease;
    }

    .tab-button:hover {
      background-color: #f1f3f5;
    }

    .tab-button.active {
      font-weight: bold;
      color: #000000;
      border-bottom: 3px solid #3c1e1e;
      background-color: #f8f9fa;
    }

    /* 고양시 동네 선택 드롭다운 영역 */
    .town-box {
      padding: 10px 12px 0 12px;
      background-color: #ffffff;
    }

    .town-select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
      background-color: #ffffff;
    }

    /* 검색창 및 버튼 영역 */
    .search-box {
      display: flex;
      padding: 12px;
      background-color: #ffffff;
      border-bottom: 1px solid #dee2e6;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      outline: none;
    }

    .search-button {
      padding: 8px 12px;
      background-color: #3c1e1e;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 장소 검색 결과 리스트 영역 */
    .place-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .place-item {
      padding: 12px;
      margin-bottom: 8px;
      background-color: #ffffff;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .place-item:hover {
      background-color: #e7f5ff;
    }

    .place-title {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 4px;
      color: #212529;
    }

    .place-address {
      font-size: 0.85rem;
      color: #868e96;
    }

    /* 오른쪽 지도 영역 */
    .map-container {
      flex: 3;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 지도 위 내 위치 재검색 전용 버튼 */
    .my-location-button {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 5;
      background-color: #ffffff;
      border: 1px solid #ced4da;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #3c1e1e;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }

    .my-location-button:hover {
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 왼쪽 사이드바 -->
    <div class="sidebar">
      <div class="sidebar-header">
        📍 우리동네 취향 지도
      </div>

      <!-- 4개 카테고리 탭 -->
      <div class="tabs">
        <button class="tab-button active" onclick="selectTab('식당')">식당</button>
        <button class="tab-button" onclick="selectTab('카페')">카페</button>
        <button class="tab-button" onclick="selectTab('소품샵')">소품샵</button>
        <button class="tab-button" onclick="selectTab('서점')">서점</button>
      </div>

      <!-- 고양시 동네 선택 드롭다운 -->
      <div class="town-box">
        <select id="townSelect" class="town-select" onchange="onSelectTown(this.value)">
          <option value="고양시 정발산동">정발산동 (밤리단길)</option>
          <option value="고양시 백석동">백석동</option>
          <option value="고양시 장항동">장항동 (라페스타/웨돔)</option>
          <option value="고양시 대화동">대화동</option>
          <option value="고양시 주엽동">주엽동</option>
          <option value="고양시 식사동">식사동</option>
          <option value="고양시 삼송동">삼송동</option>
          <option value="고양시 원흥동">원흥동</option>
          <option value="고양시 행신동">행신동</option>
          <option value="고양시 화정동">화정동</option>
        </select>
      </div>

      <!-- 직접 검색창 -->
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" value="고양시 정발산동" placeholder="지역이나 장소를 입력하세요" onkeyup="handleKeyPress(event)">
        <button class="search-button" onclick="executeSearch()">검색</button>
      </div>

      <!-- 검색 결과 리스트 -->
      <div id="placeList" class="place-list"></div>
    </div>

    <!-- 오른쪽 지도 영역 -->
    <div class="map-container">
      <button class="my-location-button" onclick="searchByMyLocation()">🎯 내 위치 주변 검색</button>
      <div id="map"></div>
    </div>
  </div>

  <script>
    // 전역 변수 선언 (영문 변수명)
    let kakaoMap = null;
    let placeSearchService = null;
    let infoWindow = null;
    let currentCategory = '식당';
    let mapMarkers = [];
    let userLatitude = null;
    let userLongitude = null;

    // 페이지 로드 시 초기화
    window.onload = function() {
      initMap();
    };

    // 카카오맵 및 검색 서비스 초기화
    function initMap() {
      const mapContainer = document.getElementById('map');
      const mapOptions = {
        center: new kakao.maps.LatLng(37.6583599, 126.8320001), // 기본 중심: 고양시청
        level: 3
      };

      kakaoMap = new kakao.maps.Map(mapContainer, mapOptions);
      placeSearchService = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      // 사용자 브라우저 GPS 위치 파악 시도
      fetchUserLocation();
    }

    // HTML5 Geolocation을 이용한 사용자 현위치 파악
    function fetchUserLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            userLatitude = position.coords.latitude;
            userLongitude = position.coords.longitude;

            // GPS로 위치를 찾았으면 내 위치 주변 검색 실행
            searchByMyLocation();
          },
          function(error) {
            // 위치 정보를 얻지 못하면 기본 지정된 동네(정발산동)로 검색
            searchPlaces();
          }
        );
      } else {
        searchPlaces();
      }
    }

    // [내 위치 주변 검색] 버튼 클릭 또는 초기 GPS 수신 완료 시 동작
    function searchByMyLocation() {
      if (userLatitude && userLongitude) {
        const currentLatLng = new kakao.maps.LatLng(userLatitude, userLongitude);
        kakaoMap.setCenter(currentLatLng);

        // 내 위치 주변 2km 반경 내 현재 탭 카테고리 검색
        const searchOptions = {
          location: currentLatLng,
          radius: 2000
        };

        placeSearchService.keywordSearch(currentCategory, placesSearchCallback, searchOptions);
      } else {
        alert("현재 위치 정보를 불러올 수 없어 설정된 동네 기준으로 검색합니다.");
        searchPlaces();
      }
    }

    // 동네 드롭다운 선택 시 실행
    function onSelectTown(townName) {
      if (!townName) return;
      document.getElementById('searchInput').value = townName;
      searchPlaces();
    }

    // 카테고리 탭 클릭 이벤트 처리
    function selectTab(categoryName) {
      currentCategory = categoryName;

      // 탭 활성화 UI 업데이트
      const tabButtons = document.querySelectorAll('.tab-button');
      tabButtons.forEach(button => {
        button.classList.remove('active');
        if (button.textContent === categoryName) {
          button.classList.add('active');
        }
      });

      // 탭 변경 시 이전 마커/리스트 초기화 후 새로운 키워드로 검색
      searchPlaces();
    }

    // 엔터키 입력 이벤트
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        executeSearch();
      }
    }

    // 검색 버튼 클릭 시 동작
    function executeSearch() {
      searchPlaces();
    }

    //
