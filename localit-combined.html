        );

        if (!isExcluded) {
          accumulatedPlaces.push(place);
        }
      });
    }

    function placesSearchCallback(data, status, pagination) {
      if (status === kakao.maps.services.Status.OK && data && data.length > 0) {
        processAndFilterPlaces(data);

        if (pagination.hasNextPage && accumulatedPlaces.length < 45) {
          pagination.nextPage();
          return;
        }
      }

      renderFinalResults();
    }

    function renderFinalResults() {
      if (accumulatedPlaces.length > 0) {
        document.getElementById('resultSummary').textContent = `현재 지도 화면 내 장소 ${accumulatedPlaces.length}곳 발견`;
        displayPlaceList(accumulatedPlaces);
        displayMarkers(accumulatedPlaces);
      } else {
        document.getElementById('resultSummary').textContent = `현재 지도 화면 내 검색 결과가 없습니다.`;
        clearPlaceList();
        removeMarkers();
      }
    }

    function displayPlaceList(places) {
      const listContainer = document.getElementById('placeList');
      clearPlaceList();

      places.forEach((place, index) => {
        const itemElement = document.createElement('div');
        itemElement.className = 'place-item';

        itemElement.innerHTML = `
          <div class="place-title">${index + 1}. ${place.place_name}</div>
          <div class="place-address">${place.road_address_name || place.address_name}</div>
        `;

        itemElement.onclick = function() {
          const moveLatLng = new kakao.maps.LatLng(place.y, place.x);
          kakaoMap.panTo(moveLatLng);
          openInfoWindow(mapMarkers[index], place);
        };

        listContainer.appendChild(itemElement);
      });
    }

    function clearPlaceList() {
      const listContainer = document.getElementById('placeList');
      listContainer.innerHTML = '';
    }

    function displayMarkers(places) {
      const currentColorHex = categoryColors[currentCategory] || '#365f50';
      const markerImage = createCustomMarkerImage(currentColorHex);

      places.forEach((place, index) => {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);

        const marker = new kakao.maps.Marker({
          position: placePosition,
          image: markerImage,
          map: kakaoMap
        });

        kakao.maps.event.addListener(marker, 'click', function() {
          openInfoWindow(marker, place);
        });

        mapMarkers.push(marker);
      });
    }

    function removeMarkers() {
      mapMarkers.forEach(marker => marker.setMap(null));
      mapMarkers = [];
    }

    function openInfoWindow(marker, place) {
      const address = place.road_address_name || place.address_name;
      const phone = place.phone ? place.phone : '전화번호 정보 없음';
      const placeUrl = place.place_url;

      const content = `
        <div style="padding: 12px; font-size: 12px; line-height: 1.5; min-width: 200px; max-width: 240px; color: #333;">
          <div style="font-weight: bold; font-size: 14px; color: #365f50; margin-bottom: 6px; border-bottom: 1px solid #eee; padding-bottom: 4px;">
            ${place.place_name}
          </div>
          <div style="margin-bottom: 4px; color: #555;">
            📍 ${address}
          </div>
          <div style="margin-bottom: 8px; color: #777; font-size: 11px;">
            📞 ${phone}
          </div>
          <div style="text-align: right;">
            <a href="${placeUrl}" target="_blank" style="display: inline-block; padding: 4px 8px; background-color: #dce7d9; color: #365f50; text-decoration: none; border-radius: 9px; font-weight: bold; font-size: 11px;">
              상세보기 ➔
            </a>
          </div>
        </div>
      `;

      infoWindow.setContent(content);
      infoWindow.open(kakaoMap, marker);
    }

    function toggleChatWindow() {
      const chatWin = document.getElementById('chatWindow');
      chatWin.style.display = (chatWin.style.display === 'flex') ? 'none' : 'flex';
    }

    function handleChatKeyPress(e) {
      if (e.key === 'Enter') sendChatMessage();
    }

    function sendChatMessage() {
      const inputEl = document.getElementById('chatInput');
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      inputEl.value = '';

      processChatWithGemini(text);
    }

    function appendMessage(msg, sender) {
      const container = document.getElementById('chatMessages');
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${sender}`;
      bubble.innerHTML = msg;
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
    }

    async function callGemini(promptText) {
      let lastError = null;

      for (const model of GEMINI_MODELS) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}`;

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              { role: 'user', parts: [{ text: promptText }] }
            ],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const data = await response.json();

        if (data.error) {
          lastError = new Error(data.error.message);
          if (response.status === 404) {
            console.warn(`모델 ${model} 사용 불가, 다음 모델로 전환합니다.`);
            continue;
          }
          throw lastError;
        }

        return data;
      }

      throw lastError || new Error('사용 가능한 Gemini 모델을 찾지 못했습니다.');
    }

    async function processChatWithGemini(userQuery) {
      appendMessage("✨ AI가 질문을 분석 중입니다...", 'bot');

      const systemPrompt = `
You are a helpful local map assistant for Goyang-si, South Korea.
Analyze the user's Korean query and extract search intentions.
Output ONLY a raw JSON object with NO markdown formatting, NO backticks, and NO extra text:
{
  "district": "extracted district name in Goyang (e.g., 식사동, 화정동, 정발산동) or null",
  "keyword": "core keyword for Kakao map search (e.g., 김밥, 카페, 파스타) or null",
  "category": "one of exactly 식당, 카페, 소품샵, 서점 that best matches the place type the user asks about, or null",
  "aiComment": "Friendly 1-2 sentence recommendation message in Korean summarizing why these places match their intent."
}
      `;

      try {
        const data = await callGemini(`${systemPrompt}\n\nUser Query: "${userQuery}"`);

        const candidateText = data.candidates && data.candidates[0] &&
          data.candidates[0].content && data.candidates[0].content.parts &&
          data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;

        if (!candidateText) {
          throw new Error('AI가 응답을 생성하지 못했습니다. 다시 시도해 주세요.');
        }

        let aiRawText = candidateText.trim();
        aiRawText = aiRawText.replace(/```json|```/g, '').trim();

        const parsedData = JSON.parse(aiRawText);

        const district = parsedData.district;
        const keyword = parsedData.keyword || "맛집";
        const aiComment = parsedData.aiComment;
        const category = parsedData.category;

        const chatContainer = document.getElementById('chatMessages');
        chatContainer.removeChild(chatContainer.lastChild);

        executeKakaoMapSearchFromAI(district, keyword, aiComment, category);

      } catch (error) {
        console.error("Gemini API Error:", error);
        const chatContainer = document.getElementById('chatMessages');
        chatContainer.removeChild(chatContainer.lastChild);
        appendMessage(`⚠️ AI 응답 오류: ${error.message || 'API 키를 확인해 주세요.'}`, 'bot');
      }
    }

    function executeKakaoMapSearchFromAI(district, keyword, aiComment, category) {
      isAiResultLocked = true;
      infoWindow.close();

      if (['식당', '카페', '소품샵', '서점'].includes(category)) {
        setActiveTabUI(category);
      }

      let fullKeyword = "고양시 ";
      if (district) {
        fullKeyword += `${district} `;
        document.getElementById('districtSelect').value = district;

        if (districtCoordinates[district]) {
          const coord = districtCoordinates[district];
          kakaoMap.setLevel(coord.level);
          kakaoMap.setCenter(new kakao.maps.LatLng(coord.lat, coord.lng));
        }
      } else {
        const currentDist = document.getElementById('districtSelect').value;
        if (currentDist !== '전체') fullKeyword += `${currentDist} `;
      }
      fullKeyword += keyword;

      removeMarkers();
      clearPlaceList();
      accumulatedPlaces = [];

      placeSearchService.keywordSearch(fullKeyword, function(data, status) {
        if (status === kakao.maps.services.Status.OK && data && data.length > 0) {
          processAndFilterPlaces(data);
          renderFinalResults();

          let botResponse = `✨ <b>AI 가이드</b><br>${aiComment}<br><br>`;
          botResponse += `📍 <b>추천 장소 Top 5</b><br>`;

          const topPlaces = accumulatedPlaces.slice(0, 5);
          topPlaces.forEach((p, idx) => {
            botResponse += `
              <div style="margin-top:6px; padding:8px; background:#eef1e6; border-radius:6px; border:1px solid #e4e6dc;">
                <b>${idx + 1}. ${p.place_name}</b><br>
                <span style="font-size:11px; color:#666;">📍 ${p.road_address_name || p.address_name}</span><br>
                <a href="${p.place_url}" target="_blank" style="font-size:11px; color:#365f50; font-weight:bold; text-decoration:none;">상세보기 ➔</a>
              </div>
            `;
          });

          appendMessage(botResponse, 'bot');
        } else {
          appendMessage(`😢 '${fullKeyword}' 장소를 찾지 못했어요. 다른 단어로 물어봐 주세요!`, 'bot');
        }
      });
    }
  <\/script>
</body>
</html>
</script>

    <div class="eyebrow">WRITE YOUR STORY</div>
    <h1 class="heading" id="editorHeading">새로운 기록</h1>
    <p class="sub">오늘 발견한 동네의 이야기를 남겨보세요.</p>
    <form id="diaryForm">
     <label class="field" for="area">지역</label>
     <select id="province" required=""><option value="">시·도를 선택하세요</option></select>
     <label class="field" for="area">시·군·구</label>
     <select disabled="" id="area" required=""><option value="">먼저 시·도를 선택하세요</option></select>
     <div class="conditional" hidden="" id="districtWrap">
      <label class="field" for="district">구</label>
      <select id="district"><option value="">구를 선택하세요</option></select>
     </div>
     <label class="field" for="place">방문 장소</label>
     <input id="place" maxlength="80" placeholder="예: 동네 작은 카페" required=""/>
     <label class="field" for="date">방문 날짜</label>
     <input id="date" required="" type="date"/>
     <label class="field" for="diaryTitle">일기 제목</label>
     <input id="diaryTitle" maxlength="100" placeholder="오늘 발견한 작은 이야기" required=""/>
     <label class="field" for="photo">사진 (선택)</label>
     <input accept="image/*" id="photo" type="file"/>
     <div id="photoPreview"></div>
     <label class="field" for="memo">오늘의 기록</label>
     <textarea id="memo" placeholder="어떤 순간이 기억에 남았나요?" required=""></textarea>
     <button class="primary" id="saveButton" type="submit">아카이브에 저장하기</button>
    </form>
   </section>
   <section class="screen" id="calendar">
    <button class="back" onclick="go('home')">‹</button>
    <div class="eyebrow">MEMORY CALENDAR</div>
    <h1 class="heading">달력으로 보기</h1>
    <div class="section calendar-controls">
     <button aria-label="이전 달 또는 연도" class="secondary" id="calendarPrev" onclick="shiftCalendar(-1)">‹</button>
     <button aria-label="연간 달력 전환" class="month-toggle" id="monthLabel" onclick="toggleYearView()"></button>
     <button aria-label="다음 달 또는 연도" class="secondary" id="calendarNext" onclick="shiftCalendar(1)">›</button>
    </div>
    <div class="calendar" id="calendarGrid"></div>
    <div class="year-grid" hidden="" id="yearGrid"></div>
    <div class="section"><h3 id="selectedLabel">이날의 기록</h3></div>
    <div id="dayEntries"></div>
   </section>
   <button aria-label="새 일기 작성" class="fab" id="addButton" onclick="newEntry()">+</button>

const DB='localit-archive-v1',STORE='diaries';let db,entries=[],currentId=null,editingId=null,returnRegion=null,chosenPhoto=null,calMonth=new Date(),selectedDate='',yearView=false;
const $ = id => document.getElementById(id);
function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}
const esc = escapeHTML;
function decodeUTF8(bytes) { return new TextDecoder('utf-8', {fatal: true}).decode(bytes); }
function encodeUTF8(value) { return new TextEncoder().encode(String(value)); }

function setupRegions(){ $('province').innerHTML='<option value="">시·도를 선택하세요</option>'+Object.keys(REGION_OPTIONS).map(x=>`<option value="${x}">${x}</option>`).join('');$('province').onchange=()=>setCities('');$('area').onchange=()=>setDistricts('') }
function setCities(selected){const province=$('province').value, isSejong=province==='세종특별자치시', options=isSejong?[]:(REGION_OPTIONS[province]||[]);$('area').parentElement; $('area').disabled=!province||isSejong;$('area').previousElementSibling.hidden=isSejong;$('area').hidden=isSejong;$('area').required=!isSejong;$('area').innerHTML='<option value="">시·군·구를 선택하세요</option>'+options.map(x=>`<option value="${x}">${x}</option>`).join('');$('area').value=isSejong?'':(selected||'');setDistricts('')}
function setDistricts(selected){const city=$('area').value,options=DISTRICTS[city]||[],visible=options.length>0;$('districtWrap').hidden=!visible;$('district').disabled=!visible;$('district').required=visible;$('district').innerHTML='<option value="">구를 선택하세요</option>'+options.map(x=>`<option value="${x}">${x}</option>`).join('');$('district').value=visible?(selected||''):''}
function request(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function init(){setupRegions();db=await new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});await refresh();go('home')}
function store(mode){return db.transaction(STORE,mode).objectStore(STORE)}
async function refresh(){entries=(await request(store('readonly').getAll())).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);renderHome();renderAlbums();renderCalendar()}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));$('addButton').style.display=id==='home'?'block':'none';if(id==='calendar')renderCalendar();if(id==='home')renderHomeCalendar();if(id==='home')$('home').scrollTop=0;window.scrollTo(0,0)}
function provinceOf(e){return e.province||Object.keys(REGION_OPTIONS).find(k=>(REGION_OPTIONS[k]||[]).includes(e.area))||e.area||'지역 미지정'}
function groups(){return [...new Set(entries.map(provinceOf))]}
function provinceEntries(p){return entries.filter(e=>provinceOf(e)===p)}
function photoCard(label,list,attribute,value,subtitle){const photo=list.find(e=>e.photo)?.photo;return `<button class="album" ${attribute}="${esc(value)}"><div class="album-art">${photo?`<img src="${photo}" alt="">`:'✿'}</div><strong>${esc(label)}</strong><small>${esc(subtitle||list.length+'개의 추억')}</small></button>`}
function albumCard(p){return photoCard(p,provinceEntries(p),'data-province',p)}
function bindAlbums(container){container.querySelectorAll('[data-province]').forEach(b=>b.onclick=()=>showProvince(b.dataset.province))}
let currentProvince='',currentCity='',currentDistrict='';
function showProvince(p){currentProvince=p;returnRegion=p;const list=provinceEntries(p);$('regionTitle').textContent=p;$('regionSub').textContent=`${list.length}개의 기록 · 지역을 선택하세요.`;const cities=[...new Set(list.map(e=>e.area||p))];$('cityAlbums').innerHTML=cities.map(c=>photoCard(c,list.filter(e=>(e.area||p)===c),'data-city',c)).join('');$('cityAlbums').querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>showCity(b.dataset.city));go('region')}
function cityEntries(){return provinceEntries(currentProvince).filter(e=>(e.area||currentProvince)===currentCity)}
function showCity(c){currentCity=c;const list=cityEntries(),districts=[...new Set(list.map(e=>e.district||'구 미지정'))];if(!list.some(e=>e.district)){currentDistrict='';$('districtTitle').textContent=c;$('districtSub').textContent=`${list.length}개의 기록을 모았어요.`;fillEntries('regionEntries',list);go('districtScreen');return}$('cityTitle').textContent=c;$('citySub').textContent=`${list.length}개의 기록 · 구를 선택하세요.`;$('districtAlbums').innerHTML=districts.map(d=>photoCard(d,list.filter(e=>(e.district||'구 미지정')===d),'data-district',d)).join('');$('districtAlbums').querySelectorAll('[data-district]').forEach(b=>b.onclick=()=>showDistrict(b.dataset.district));go('cityScreen')}
function showDistrict(d){currentDistrict=d;const list=cityEntries().filter(e=>(e.district||'구 미지정')===d);$('districtTitle').textContent=d;$('districtSub').textContent=`${list.length}개의 기록을 모았어요.`;fillEntries('regionEntries',list);go('districtScreen')}
function backToCity(){if(cityEntries().some(e=>e.district))showCity(currentCity);else showProvince(currentProvince)}
function entryCard(e){return `<button class="entry" data-id="${e.id}"><div class="thumb">${e.photo?`<img src="${e.photo}" alt="">`:'✿'}</div><div><strong>${esc(e.title)}</strong><p>${esc(e.place)} · ${esc(e.date)}</p><small>${esc(e.memo.slice(0,35))}${e.memo.length>35?'…':''}</small></div></button>`}
function bindEntries(container){container.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>showDetail(Number(b.dataset.id)))}
function fillEntries(id,list){$(id).innerHTML=list.length?list.map(entryCard).join(''):'<div class="empty">아직 기록이 없어요.<br>첫 번째 동네 이야기를 남겨보세요 ✎</div>';bindEntries($(id))}
function renderHome(){$('count').textContent=entries.length;$('regions').textContent=groups().length;const recent=[...entries].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,7);$('homeAlbums').innerHTML=recent.map(entryCard).join('')||'<div class="empty">아직 기록이 없어요.<br>새 기록을 남기면 이곳에 표시돼요.</div>';bindEntries($('homeAlbums'));renderHomeCalendar()}
function renderAlbums(){$('allAlbums').innerHTML=groups().map(albumCard).join('')||'<div class="empty" style="grid-column:span 2">기록을 추가하면 지역별 앨범이 생겨요.</div>';bindAlbums($('allAlbums'))}
function backFromDetail(){if(detailOrigin==='districtScreen'){if(currentDistrict)showDistrict(currentDistrict);else showCity(currentCity)}else go(detailOrigin||'home')}
let detailOrigin='home';function showDetail(id){detailOrigin=document.querySelector('.screen.active')?.id||'home';const e=entries.find(x=>x.id===id);if(!e)return;currentId=id;$('moreMenu').hidden=true;$('detailRegion').textContent=(e.district?e.area+' '+e.district:e.area).toUpperCase()+' · LOCAL DIARY';$('detailTitle').textContent=e.title;$('detailMeta').textContent=e.date+'  |  '+e.place;$('detailPhoto').innerHTML=e.photo?`<img class="cover" src="${e.photo}" alt="방문 사진">`:'<div class="placeholder">✿</div>';$('detailText').textContent=e.memo;go('detail')}
function toggleMenu(){$('moreMenu').hidden=!$('moreMenu').hidden}
function newEntry(){editingId=null;chosenPhoto=null;$('diaryForm').reset();setCities('');$('date').value=new Date().toLocaleDateString('sv-SE');$('photoPreview').innerHTML='';$('editorHeading').textContent='새로운 기록';$('saveButton').textContent='아카이브에 저장하기';go('editor')}
function editEntry(){const e=entries.find(x=>x.id===currentId);if(!e)return;editingId=e.id;chosenPhoto=e.photo||null;const province=e.province||Object.keys(REGION_OPTIONS).find(k=>REGION_OPTIONS[k].includes(e.area))||'';$('province').value=province;setCities(e.area);setDistricts(e.district||'');$('place').value=e.place;$('date').value=e.date;$('diaryTitle').value=e.title;$('memo').value=e.memo;$('photo').value='';preview();$('editorHeading').textContent='기록 수정하기';$('saveButton').textContent='수정 내용 저장하기';go('editor')}
async function deleteEntry(){$('moreMenu').hidden=true;if(!confirm('이 일기를 삭제할까요? 삭제한 기록은 되돌릴 수 없어요.'))return;await request(store('readwrite').delete(currentId));currentId=null;await refresh();go('home')}
function preview(){$('photoPreview').innerHTML=chosenPhoto?`<img class="preview" src="${chosenPhoto}" alt="첨부 사진"><button type="button" class="secondary" id="removePhoto">사진 제거</button>`:'';if($('removePhoto'))$('removePhoto').onclick=()=>{chosenPhoto=null;$('photo').value='';preview()}}
$('photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>12*1024*1024){alert('12MB 이하 사진을 선택해 주세요.');e.target.value='';return}const img=new Image(),url=URL.createObjectURL(f);try{await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const scale=Math.min(1,1100/img.width,1100/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);chosenPhoto=c.toDataURL('image/jpeg',.76);preview()}catch{alert('사진을 불러올 수 없어요.')}finally{URL.revokeObjectURL(url)}};
$('diaryForm').onsubmit=async ev=>{ev.preventDefault();const e={id:editingId??Date.now(),province:$('province').value,area:$('province').value==='세종특별자치시'?'세종특별자치시':$('area').value.trim(),district:$('district').value,place:$('place').value.trim(),date:$('date').value,title:$('diaryTitle').value.trim(),memo:$('memo').value.trim(),photo:chosenPhoto};if(!e.province||!e.area||(DISTRICTS[e.area]&&!e.district)||!e.place||!e.title||!e.memo)return;try{await request(store('readwrite').put(e));await refresh();showDetail(e.id)}catch(err){alert('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.')}};
let homeMonth=new Date();
function shiftHomeMonth(n){homeMonth=new Date(homeMonth.getFullYear(),homeMonth.getMonth()+n,1);renderHomeCalendar()}
function openFullCalendar(){calMonth=new Date(homeMonth.getFullYear(),homeMonth.getMonth(),1);yearView=false;selectedDate='';go('calendar')}
function renderHomeCalendar(){const y=homeMonth.getFullYear(),m=homeMonth.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();$('homeMonthLabel').textContent=`${y}. ${String(m+1).padStart(2,'0')}`;let h=['일','월','화','수','목','금','토'].map(x=>`<div class="week">${x}</div>`).join('');for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=entries.some(e=>e.date===date);h+=`<button class="day ${has?'has':''}" data-date="${date}" aria-label="${date}${has?' 기록 있음':''}">${d}${has?' •':''}</button>`}$('homeCalendarGrid').innerHTML=h;$('homeCalendarGrid').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{calMonth=new Date(y,m,1);yearView=false;selectedDate=b.dataset.date;go('calendar')})}
function shiftCalendar(n){calMonth=new Date(calMonth.getFullYear()+(yearView?n:0),yearView?calMonth.getMonth():calMonth.getMonth()+n,1);selectedDate='';renderCalendar()}

const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let h=['일','월','화','수','목','금','토'].map(x=>`<div class="week">${x}</div>`).join('');for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;h+=`<button class="day ${entries.some(e=>e.date===date)?'has':''} ${selectedDate===date?'selected':''}" data-date="${date}">${d}${entries.some(e=>e.date===date)?' •':''}</button>`}$('calendarGrid').innerHTML=h;$('calendarGrid').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;renderCalendar()});fillEntries('dayEntries',selectedDate?entries.filter(e=>e.date===selectedDate):[])}

<script type="text/plain" id="src-stamp">
<!DOCTYPE html>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {

  <style>
    body { font-family: Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background-color: #f7f5eb; color: #263e35; }
    .font-cute { font-family: Georgia,"Malgun Gothic",serif; }

    @keyframes stampBounce {
      0% { transform: scale(3) rotate(-15deg); opacity: 0; }
      50% { transform: scale(0.9) rotate(5deg); opacity: 1; }
      75% { transform: scale(1.1) rotate(-3deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .animate-stamp { animation: stampBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    @keyframes shine {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .coupon-shine {
      background-image: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.55) 50%, transparent 70%);
      background-size: 200% 100%;
      animation: shine 3s linear infinite;
    }

    ::-webkit-scrollbar { width: 8px; }

<body class="min-h-screen flex flex-col">

  <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-sky-200 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3">

        <h1 class="font-cute text-2xl sm:text-3xl font-bold text-sky-800 tracking-wide flex items-center gap-1.5">
          숨은 고양 찾기 <span class="text-xs font-gowun bg-skyPrimary text-white px-2 py-0.5 rounded-full font-normal">스탬프 투어</span>

  <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-6">

    <div class="bg-gradient-to-r from-skyPrimary via-skyBright to-indigo-300 p-6 rounded-3xl text-white shadow-md relative overflow-hidden">
      <div class="relative z-10">
        <span class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase">Local Stamp Tour</span>
        <h2 class="font-cute text-3xl sm:text-4xl font-bold mt-2">고양시 골목 탐험 도장판 🐾</h2>
        <p class="text-xs sm:text-sm text-sky-50 mt-1 max-w-xl">
          고양시 곳곳의 퀘스트를 완료하고 귀여운 도장을 모아보세요! 6개를 모두 모으면 특별 쿠폰이 발급됩니다 🎁
        </p>

        <div class="mt-4 bg-white/20 p-3 rounded-2xl max-w-md border border-white/30">
          <div class="flex justify-between text-xs font-bold mb-1">
            <span>달성률</span>
            <span id="stamp-progress-text">0 / 6 완료</span>
          </div>
          <div class="w-full bg-white/30 rounded-full h-3 overflow-hidden">
            <div id="stamp-progress-bar" class="bg-creamBg h-full w-0 transition-all duration-500 rounded-full"></div>
          </div>
        </div>
      </div>
      <div class="absolute -right-6 -bottom-6 text-8xl opacity-20 pointer-events-none select-none">🐱</div>
    </div>

    <section id="couponSection" class="hidden"></section>

    <div class="bg-white p-6 rounded-3xl border border-sky-200 shadow-sm">
      <div class="flex items-center justify-between mb-6">
        <h3 class="font-cute text-2xl font-bold text-slate-800 flex items-center gap-2">
          Stamp Collector Card <span class="text-xs font-gowun text-skyPrimary font-normal">(터치하여 도장 찍기)</span>
        </h3>
        <button onclick="resetAll()" class="text-xs text-slate-400 hover:text-rose-500 underline">전체 초기화</button>
      </div>
      <div id="stampGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
    </div>

    <div class="bg-white p-6 rounded-3xl border border-sky-200 shadow-sm">
      <h3 class="font-cute text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2">🎯 진행 가능한 동네 퀘스트</h3>
      <div id="questList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

  </main>

  <footer class="bg-white border-t border-sky-100 py-6 mt-12 text-center text-xs text-slate-400">
    <div class="max-w-4xl mx-auto px-4 space-y-2">
      <p class="font-cute text-base text-sky-800">🐾 고양 로컬 콘텐츠 & 브랜딩 프로젝트</p>
      <p>경기도 고양시를 새로운 시선으로 기록하고 골목상권을 활성화합니다.</p>
    </div>
  </footer>

  <div id="couponModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-xl border border-amber-200 text-center space-y-3 animate-stamp">
      <div class="text-6xl">🎉</div>
      <h3 class="font-cute text-3xl font-bold text-amber-900">스탬프 투어 완주!</h3>
      <p class="text-sm text-slate-600">고양시 골목 6곳을 모두 탐험했어요.<br>축하 쿠폰이 발급되었습니다 🎁</p>
      <button onclick="closeCouponModal()" class="w-full mt-2 px-5 py-2.5 bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold rounded-2xl font-cute text-xl shadow-sm transition-all">
        내 쿠폰 확인하기
      </button>
    </div>
  </div>

  <script>
    const spots = [
      { id: 1, title: "밤리단길 카페거리", category: "카페", quest: "밤리단길 시그니처 디저트 맛보고 사진 찍기 🍰", stampIcon: "🐾" },
      { id: 2, title: "일산호수공원", category: "자연", quest: "호수 둘레길 산책하며 예쁜 풍경 인증샷 찍기 🚲", stampIcon: "🌸" },
      { id: 3, title: "행주산성", category: "문화유산", quest: "행주산성 역사 산책길에서 한강 전경 바라보기 🏯", stampIcon: "⭐" },
      { id: 4, title: "서오릉", category: "문화유산", quest: "울창한 왕릉 소나무 숲길 30분 걸어보기 🌲", stampIcon: "🌿" },
      { id: 5, title: "고양가와지밥박물관", category: "박물관", quest: "가와지 벼 이야기 읽고 한반도 벼 역사퀴즈 풀기 🌾", stampIcon: "🌾" },
      { id: 6, title: "원당 화훼단지 골목", category: "자연", quest: "마음에 드는 작은 다육식물 모종 하나 찾아보기 🪴", stampIcon: "🪴" }
    ];

    const COUPON_NAME = "고양 로컬 스탬프 투어 완주 쿠폰";
    const COUPON_BENEFIT = "제휴 로컬 매장 10% 할인";
    const COUPON_VALID_DAYS = 30;

    function load(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : fallback;
      } catch (e) { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    let userStamps = load('goyang_stamps', null);
    if (!Array.isArray(userStamps) || userStamps.length !== spots.length) {
      userStamps = spots.map(() => false);
    }
    let coupon = load('goyang_coupon', null);

    window.onload = function () {
      renderStamps();
      renderQuests();
      renderCoupon();
    };

    function renderStamps() {
      const grid = document.getElementById('stampGrid');
      const completed = userStamps.filter(Boolean).length;

      grid.innerHTML = spots.map((spot, idx) => {
        const stamped = userStamps[idx];
        return `
          <div onclick="toggleStamp(${idx})"
               class="relative aspect-square bg-skyPastel/20 border-2 ${stamped ? 'border-skyPrimary bg-skyPastel/50' : 'border-dashed border-sky-300'} rounded-2xl p-2 flex flex-col items-center justify-center text-center cursor-pointer hover:shadow-md transition-all group">
            ${stamped ? `
              <div class="animate-stamp text-4xl sm:text-5xl select-none">${spot.stampIcon}</div>
              <span class="font-cute text-sm font-bold text-skyAccent mt-1">도장 완료!</span>
              <span class="text-[10px] text-slate-500 mt-0.5">${spot.title}</span>
            ` : `
              <div class="text-3xl opacity-30 group-hover:opacity-60 transition-opacity">🐾</div>
              <span class="text-[11px] font-medium text-slate-400 mt-1">${spot.title}</span>
              <span class="text-[9px] text-skyPrimary opacity-0 group-hover:opacity-100 transition-opacity">터치 시 도장</span>
            `}
            <span class="absolute top-1.5 left-2 text-[10px] font-bold text-slate-300">#0${idx + 1}</span>
          </div>
        `;
      }).join('');

      document.getElementById('stamp-progress-text').innerText = `${completed} / ${spots.length} 완료`;
      document.getElementById('stamp-progress-bar').style.width = `${(completed / spots.length) * 100}%`;
    }

    function toggleStamp(idx) {
      userStamps[idx] = !userStamps[idx];
      save('goyang_stamps', userStamps);
      renderStamps();
      renderQuests();

      if (userStamps[idx]) {
        showToast(`🎉 [${spots[idx].title}] 퀘스트 도장을 찍었습니다!`);
      }

      if (userStamps.every(Boolean) && !coupon) {
        issueCoupon();
      }
    }

    function resetAll() {
      const msg = coupon && !coupon.used
        ? '모든 도장과 발급된 쿠폰(미사용)이 삭제됩니다. 초기화하시겠습니까?'
        : '모든 도장을 초기화하시겠습니까?';
      if (!confirm(msg)) return;
      userStamps = spots.map(() => false);
      coupon = null;
      save('goyang_stamps', userStamps);
      try { localStorage.removeItem('goyang_coupon'); } catch (e) {}
      renderStamps();
      renderQuests();
      renderCoupon();
    }

    function renderQuests() {
      const container = document.getElementById('questList');
      container.innerHTML = spots.map((spot, idx) => {
        const done = userStamps[idx];
        return `
          <div class="p-4 rounded-2xl border ${done ? 'bg-skyPastel/30 border-skyPrimary/40' : 'bg-white border-sky-100'} flex items-center justify-between gap-3">
            <div class="space-y-1">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${done ? 'bg-skyPrimary text-white' : 'bg-slate-100 text-slate-600'}">
                ${done ? '완료됨 ✨' : '도전 가능'}
              </span>
              <h4 class="font-bold text-slate-800 text-sm">${spot.title}</h4>
              <p class="text-xs text-slate-600">${spot.quest}</p>
            </div>
            <button onclick="toggleStamp(${idx})"
                    class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all shrink-0 ${done ? 'bg-slate-200 text-slate-600' : 'bg-skyPrimary hover:bg-skyAccent text-white shadow-sm'}">
              ${done ? '도장 취소' : '도장 찍기 🐾'}
            </button>
          </div>
        `;
      }).join('');
    }

    function generateCouponCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let part = '';
      for (let i = 0; i < 8; i++) part += chars[Math.floor(Math.random() * chars.length)];
      return `GY-${part.slice(0, 4)}-${part.slice(4)}`;
    }

    function issueCoupon() {
      const now = new Date();
      const expires = new Date(now.getTime() + COUPON_VALID_DAYS * 24 * 60 * 60 * 1000);
      coupon = {
        code: generateCouponCode(),
        issuedAt: now.toISOString(),
        expiresAt: expires.toISOString(),
        used: false
      };
      save('goyang_coupon', coupon);
      renderCoupon();
      document.getElementById('couponModal').classList.remove('hidden');
    }

    function closeCouponModal() {
      document.getElementById('couponModal').classList.add('hidden');
      const sec = document.getElementById('couponSection');
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    }

    const CODE128_PATTERNS = [
      "212222","222122","222221","121223","121322","131222","122213","122312","132212","221213",
      "221312","231212","112232","122132","122231","113222","123122","123221","223211","221132",
      "221231","213212","223112","312131","311222","321122","321221","312212","322112","322211",
      "212123","212321","232121","111323","131123","131321","112313","132113","132311","211313",
      "231113","231311","112133","112331","132131","113123","113321","133121","313121","211331",
      "231131","213113","213311","213131","311123","311321","331121","312113","312311","332111",
      "314111","221411","431111","111224","111422","121124","121421","141122","141221","112214",
      "112412","122114","122411","142112","142211","241211","221114","413111","241112","134111",
      "111242","121142","121241","114212","124112","124211","411212","421112","421211","212141",
      "214121","412121","111143","111341","131141","114113","114311","411113","411311","113141",
      "114131","311141","411131","211412","211214","211232","2331112"
    ];

    function code128Svg(text, height = 64) {
      const START_B = 104, STOP = 106;
      const values = [START_B];
      for (const ch of text) {
        const v = ch.charCodeAt(0) - 32;
        if (v < 0 || v > 94) return '';
        values.push(v);
      }
      let sum = START_B;
      for (let i = 1; i < values.length; i++) sum += values[i] * i;
      values.push(sum % 103, STOP);

      const quiet = 10;
      let x = quiet;
      let bars = '';
      values.forEach(v => {
        const pattern = CODE128_PATTERNS[v];
        for (let i = 0; i < pattern.length; i++) {
          const w = parseInt(pattern[i], 10);
          if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="${height}" fill="#0f172a"/>`;
          x += w;
        }
      });
      const total = x + quiet;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${height}" preserveAspectRatio="none" class="w-full block" style="height:${height}px" shape-rendering="crispEdges" role="img" aria-label="쿠폰 바코드 ${text}"><rect width="${total}" height="${height}" fill="#ffffff"/>${bars}</svg>`;
    }

    function renderCoupon() {
      const sec = document.getElementById('couponSection');
      if (!coupon) {
        sec.classList.add('hidden');
        sec.innerHTML = '';
        return;
      }

      const expired = new Date(coupon.expiresAt) < new Date();
      const inactive = coupon.used || expired;
      const statusLabel = coupon.used ? '사용 완료' : (expired ? '기간 만료' : '사용 가능');
      const statusClass = inactive ? 'bg-slate-200 text-slate-600' : 'bg-emerald-100 text-emerald-700';

      sec.classList.remove('hidden');
      sec.innerHTML = `
        <h3 class="font-cute text-2xl font-bold text-slate-800 mb-3 flex items-center gap-2">🎁 내 쿠폰</h3>
        <div class="ticket ${inactive ? 'used' : ''} relative overflow-hidden rounded-3xl border-2 ${inactive ? 'border-slate-300 bg-slate-100' : 'border-amber-300 bg-gradient-to-r from-amber-50 via-yellow-50 to-orange-50'} shadow-md">
          ${inactive ? '' : '<div class="coupon-shine absolute inset-0 pointer-events-none"></div>'}
          <div class="relative flex flex-col sm:flex-row">
            <div class="flex-grow p-5 sm:p-6 space-y-2">
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${statusClass}">${statusLabel}</span>
                <span class="text-[10px] text-slate-500">스탬프 투어 완주 보상</span>
              </div>
              <h4 class="font-cute text-2xl sm:text-3xl font-bold ${inactive ? 'text-slate-500' : 'text-amber-900'}">${COUPON_NAME}</h4>
              <p class="text-lg font-bold ${inactive ? 'text-slate-500' : 'text-orange-600'}">${COUPON_BENEFIT}</p>
              <p class="text-xs text-slate-500">
                발급일 ${formatDate(coupon.issuedAt)} · 유효기간 ~ ${formatDate(coupon.expiresAt)}
              </p>
            </div>
            <div class="sm:w-60 p-5 sm:p-6 border-t-2 sm:border-t-0 sm:border-l-2 border-dashed ${inactive ? 'border-slate-300' : 'border-amber-300'} flex flex-col items-center justify-center gap-2 text-center">
              <span class="text-[10px] text-slate-500 font-bold">쿠폰 코드</span>
              <div class="font-mono text-xl font-bold tracking-widest ${inactive ? 'text-slate-400 line-through' : 'text-slate-800'}">${coupon.code}</div>
              <div class="flex gap-2 w-full">
                <button onclick="copyCouponCode()" class="flex-1 px-3 py-1.5 rounded-xl text-xs font-bold bg-white border border-amber-300 text-amber-800 hover:bg-amber-50 transition-all">코드 복사</button>
                ${inactive ? '' : '<button onclick="useCoupon()" class="flex-1 px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-400 hover:bg-amber-500 text-amber-950 transition-all">사용하기</button>'}
              </div>
            </div>
          </div>
          <div class="relative px-5 sm:px-6 pb-5 sm:pb-6 pt-4 border-t-2 border-dashed ${inactive ? 'border-slate-300' : 'border-amber-300'}">
            <div class="max-w-md mx-auto ${inactive ? 'opacity-40' : ''}">
              <div class="rounded-xl overflow-hidden border border-slate-200 bg-white p-2">
                ${code128Svg(coupon.code)}
                <div class="text-center font-mono text-xs tracking-[0.3em] text-slate-700 mt-1">${coupon.code}</div>
              </div>
            </div>
          </div>
        </div>
        <p class="text-[11px] text-slate-400 mt-2">※ 매장에서 직원에게 쿠폰 화면을 보여준 뒤 '사용하기'를 눌러주세요. 사용 처리 후에는 되돌릴 수 없습니다.</p>
      `;
    }

    function copyCouponCode() {
      if (!coupon) return;
      const done = () => showToast('📋 쿠폰 코드가 복사되었습니다!');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(coupon.code).then(done).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
      function fallbackCopy() {
        const ta = document.createElement('textarea');
        ta.value = coupon.code;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { showToast('복사에 실패했어요. 코드를 직접 선택해주세요.'); }
        ta.remove();
      }
    }

    function useCoupon() {
      if (!coupon || coupon.used) return;
      if (!confirm('쿠폰을 사용 처리할까요? 사용 후에는 되돌릴 수 없어요.')) return;
      coupon.used = true;
      save('goyang_coupon', coupon);
      renderCoupon();
      showToast('✅ 쿠폰이 사용 처리되었습니다.');
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-6 right-6 bg-slate-800/90 text-white text-xs px-4 py-3 rounded-2xl shadow-xl z-[60] animate-stamp font-gowun';
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
  <\/script>
</body>
</html>
</script>

<script>
  // 각 탭을 처음 열 때 해당 화면의 원본 코드를 독립 프레임에 로드합니다.
  // (지도는 보이는 상태에서 로드해야 크기가 정상 계산되므로 지연 로드)
  const loaded = {};
  function loadView(name) {
    if (loaded[name]) return;
    loaded[name] = true;
    const raw = document.getElementById('src-' + name).textContent;
    // 내부 스크립트 종료 태그 이스케이프(<\/script>)를 원래대로 복원
    document.getElementById('frame-' + name).srcdoc = raw.replace(/<\\\/script/gi, '</script');
  }

  function showView(name) {
    document.querySelectorAll('.main-tab').forEach(b => b.classList.toggle('active', b.dataset.view === name));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
    loadView(name);
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
  }

  document.querySelectorAll('.main-tab').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));

  const initial = (location.hash || '').replace('#', '');
  showView(['map', 'archive', 'stamp'].includes(initial) ? initial : 'map');
</script>
</body>
</html>
