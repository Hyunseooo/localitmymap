<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOCALIT 지도</title>
  
  <!-- 카카오맵 JavaScript API (services 라이브러리 포함) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b3c1b3d89c3faba562c87e2765978f03&libraries=services"></script>

  <style>
    /* 기본 리셋 CSS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      overflow: hidden;
    }

    /* 1:3 비율 레이아웃 (Flexbox) */
    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 왼쪽 사이드바 (약 1 비율) */
    .sidebar {
      flex: 1;
      min-width: 280px;
      max-width: 360px;
      background-color: #f8f9fa;
      border-right: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    /* 서비스 이름 헤더 */
    .sidebar-header {
      padding: 18px 16px;
      background-color: #3c1e1e;
      color: #ffffff;
      font-weight: bold;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 1px;
    }

    .sidebar-header span {
      color: #ffeb00;
    }

    /* 4개 카테고리 탭 영역 */
    .tabs {
      display: flex;
      background-color: #ffffff;
      border-bottom: 1px solid #dee2e6;
    }

    .tab-button {
      flex: 1;
      padding: 12px 0;
      border: none;
      background-color: #ffffff;
      cursor: pointer;
      font-size: 0.88rem;
      color: #495057;
      transition: all 0.2s ease;
    }

    .tab-button:hover {
      background-color: #f1f3f5;
    }

    /* 활성화된 탭 스타일 */
    .tab-button.active {
      font-weight: bold;
      color: #000000;
      border-bottom: 3px solid #3c1e1e;
      background-color: #f8f9fa;
    }

    /* 동네 선택 필터 영역 */
    .district-box {
      padding: 10px 12px 0 12px;
      background-color: #ffffff;
    }

    .district-select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      outline: none;
      font-size: 0.88rem;
      background-color: #f8f9fa;
      color: #212529;
      cursor: pointer;
    }

    .district-select:focus {
      border-color: #3c1e1e;
    }

    /* 검색창 영역 */
    .search-box {
      display: flex;
      padding: 10px 12px;
      background-color: #ffffff;
      border-bottom: 1px solid #dee2e6;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      outline: none;
      font-size: 0.9rem;
    }

    .search-input:focus {
      border-color: #3c1e1e;
    }

    .search-button {
      padding: 8px 14px;
      background-color: #3c1e1e;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* 검색 결과 안내창 */
    .result-summary {
      padding: 8px 12px;
      font-size: 0.8rem;
      color: #6c757d;
      background-color: #e9ecef;
      border-bottom: 1px solid #dee2e6;
    }

    /* 장소 목록 영역 */
    .place-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .place-item {
      padding: 12px;
      margin-bottom: 8px;
      background-color: #ffffff;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .place-item:hover {
      background-color: #f1f3f5;
    }

    .place-title {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 4px;
      color: #212529;
    }

    .place-address {
      font-size: 0.82rem;
      color: #868e96;
    }

    /* 오른쪽 지도 영역 (약 3 비율) */
    .map-container {
      flex: 3;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 왼쪽 사이드바 -->
    <div class="sidebar">
      <!-- 서비스 이름 -->
      <div class="sidebar-header">
        📍 <span>LOCALIT</span> 지도
      </div>

      <!-- 4개 카테고리 탭 -->
      <div class="tabs">
        <button class="tab-button active" onclick="selectTab('식당')">식당</button>
        <button class="tab-button" onclick="selectTab('카페')">카페</button>
        <button class="tab-button" onclick="selectTab('소품샵')">소품샵</button>
        <button class="tab-button" onclick="selectTab('서점')">서점</button>
      </div>

      <!-- 고양시 동네 선택 드롭다운 -->
      <div class="district-box">
        <select id="districtSelect" class="district-select" onchange="handleDistrictChange()">
          <option value="전체">고양시 전체</option>
          
          <optgroup label="덕양구">
            <option value="화정동">덕양구 화정동</option>
            <option value="행신동">덕양구 행신동</option>
            <option value="삼송동">덕양구 삼송동</option>
            <option value="원흥동">덕양구 원흥동</option>
            <option value="지축동">덕양구 지축동</option>
            <option value="원당동">덕양구 원당동</option>
            <option value="향동동">덕양구 향동동</option>
            <option value="덕은동">덕양구 덕은동</option>
            <option value="주교동">덕양구 주교동</option>
            <option value="성사동">덕양구 성사동</option>
            <option value="신원동">덕양구 신원동</option>
            <option value="고양동">덕양구 고양동</option>
            <option value="관산동">덕양구 관산동</option>
            <option value="도내동">덕양구 도내동</option>
            <option value="동산동">덕양구 동산동</option>
          </optgroup>
          
          <optgroup label="일산동구">
            <option value="장항동">일산동구 장항동 (라페스타/웨돔)</option>
            <option value="정발산동">일산동구 정발산동 (밤리단길)</option>
            <option value="백석동">일산동구 백석동</option>
            <option value="마두동">일산동구 마두동</option>
            <option value="중산동">일산동구 중산동</option>
            <option value="식사동">일산동구 식사동</option>
            <option value="풍동">일산동구 풍동</option>
            <option value="성석동">일산동구 성석동</option>
          </optgroup>
          
          <optgroup label="일산서구">
            <option value="가좌동">일산서구 가좌동</option>
            <option value="주엽동">일산서구 주엽동</option>
            <option value="대화동">일산서구 대화동 (킨텍스)</option>
            <option value="탄현동">일산서구 탄현동</option>
            <option value="덕이동">일산서구 덕이동</option>
            <option value="일산동">일산서구 일산동</option>
            <option value="구산동">일산서구 구산동</option>
            <option value="법곳동">일산서구 법곳동</option>
          </optgroup>
        </select>
      </div>

      <!-- 검색창 -->
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="장소/키워드 입력 (선택)" onkeyup="handleKeyPress(event)">
        <button class="search-button" onclick="executeSearch()">검색</button>
      </div>

      <!-- 결과 수 요약 안내창 -->
      <div id="resultSummary" class="result-summary">
        검색 진행 중...
      </div>

      <!-- 검색 결과 리스트 -->
      <div id="placeList" class="place-list">
        <!-- JS로 검색된 장소 목록이 들어옵니다. -->
      </div>
    </div>

    <!-- 오른쪽 지도 영역 -->
