<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOCALIT 지도</title>
  
  <!-- 카카오맵 JavaScript API (services 라이브러리 포함) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b3c1b3d89c3faba562c87e2765978f03&libraries=services"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      overflow: hidden;
    }

    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .sidebar {
      flex: 1;
      min-width: 280px;
      max-width: 360px;
      background-color: #f8f9fa;
      border-right: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .sidebar-header {
      padding: 18px 16px;
      background-color: #3c1e1e;
      color: #ffffff;
      font-weight: bold;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 1px;
    }

    .sidebar-header span {
      color: #ffeb00;
    }

    .tabs {
      display: flex;
      background-color: #ffffff;
      border-bottom: 1px solid #dee2e6;
    }

    .tab-button {
      flex: 1;
      padding: 12px 0;
      border: none;
      background-color: #ffffff;
      cursor: pointer;
      font-size: 0.88rem;
      color: #495057;
      transition: all 0.2s ease;
    }

    .tab-button:hover {
      background-color: #f1f3f5;
    }

    .tab-button.active {
      font-weight: bold;
      color: #000000;
      border-bottom: 3px solid #3c1e1e;
      background-color: #f8f9fa;
    }

    .district-box {
      padding: 10px 12px 0 12px;
      background-color: #ffffff;
    }

    .district-select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      outline: none;
      font-size: 0.88rem;
      background-color: #f8f9fa;
      color: #212529;
      cursor: pointer;
    }

    .district-select:focus {
      border-color: #3c1e1e;
    }

    .search-box {
      display: flex;
      padding: 10px 12px;
      background-color: #ffffff;
      border-bottom: 1px solid #dee2e6;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      outline: none;
      font-size: 0.9rem;
    }

    .search-input:focus {
      border-color: #3c1e1e;
    }

    .search-button {
      padding: 8px 14px;
      background-color: #3c1e1e;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .result-summary {
      padding: 8px 12px;
      font-size: 0.8rem;
      color: #6c757d;
      background-color: #e9ecef;
      border-bottom: 1px solid #dee2e6;
    }

    .place-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .place-item {
      padding: 12px;
      margin-bottom: 8px;
      background-color: #ffffff;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .place-item:hover {
      background-color: #f1f3f5;
    }

    .place-title {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 4px;
      color: #212529;
    }

    .place-address {
      font-size: 0.82rem;
      color: #868e96;
    }

    .map-container {
      flex: 3;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        📍 <span>LOCALIT</span> 지도
      </div>

      <div class="tabs">
        <button class="tab-button active" onclick="selectTab('식당')">식당</button>
        <button class="tab-button" onclick="selectTab('카페')">카페</button>
        <button class="tab-button" onclick="selectTab('소품샵')">소품샵</button>
        <button class="tab-button" onclick="selectTab('서점')">서점</button>
      </div>

      <div class="district-box">
        <select id="districtSelect" class="district-select" onchange="handleDistrictChange()">
          <option value="전체">고양시 전체</option>
          
          <optgroup label="덕양구">
            <option value="화정동">덕양구 화정동</option>
            <option value="행신동">덕양구 행신동</option>
            <option value="삼송동">덕양구 삼송동</option>
            <option value="원흥동">덕양구 원흥동</option>
            <option value="지축동">덕양구 지축동</option>
            <option value="원당동">덕양구 원당동</option>
            <option value="향동동">덕양구 향동동</option>
            <option value="덕은동">덕양구 덕은동</option>
            <option value="주교동">덕양구 주교동</option>
            <option value="성사동">덕양구 성사동</option>
            <option value="신원동">덕양구 신원동</option>
            <option value="고양동">덕양구 고양동</option>
            <option value="관산동">덕양구 관산동</option>
            <option value="도내동">덕양구 도내동</option>
            <option value="동산동">덕양구 동산동</option>
          </optgroup>
          
          <optgroup label="일산동구">
            <option value="장항동">일산동구 장항동 (라페스타/웨돔)</option>
            <option value="정발산동">일산동구 정발산동 (밤리단길)</option>
            <option value="백석동">일산동구 백석동</option>
            <option value="마두동">일산동구 마두동</option>
            <option value="중산동">일산동구 중산동</option>
            <option value="식사동">일산동구 식사동</option>
            <option value="풍동">일산동구 풍동</option>
            <option value="성석동">일산동구 성석동</option>
          </optgroup>
          
          <optgroup label="일산서구">
            <option value="가좌동">일산서구 가좌동</option>
            <option value="주엽동">일산서구 주엽동</option>
            <option value="대화동">일산서구 대화동 (킨텍스)</option>
            <option value="탄현동">일산서구 탄현동</option>
            <option value="덕이동">일산서구 덕이동</option>
            <option value="일산동">일산서구 일산동</option>
            <option value="구산동">일산서구 구산동</option>
            <option value="법곳동">일산서구 법곳동</option>
          </optgroup>
        </select>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="장소/키워드 입력 (선택)" onkeyup="handleKeyPress(event)">
        <button class="search-button" onclick="executeSearch()">검색</button>
      </div>

      <div id="resultSummary" class="result-summary">
        검색 진행 중...
      </div>

      <div id="placeList" class="place-list"></div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script>
    let kakaoMap = null;
    let placeSearchService = null;
    let infoWindow = null;
    let currentCategory = '식당';
    let mapMarkers = [];
    let accumulatedPlaces = [];
    let isDistrictChanging = false;

    const districtCoordinates = {
      '전체': { lat: 37.6583599, lng: 126.8320001, level: 7 },
      '화정동': { lat: 37.6353, lng: 126.8322, level: 4 },
      '행신동': { lat: 37.6148, lng: 126.8341, level: 4 },
      '삼송동': { lat: 37.6521, lng: 126.8953, level: 4 },
      '원흥동': { lat: 37.6499, lng: 126.8722, level: 4 },
      '지축동': { lat: 37.6534, lng: 126.9082, level: 4 },
      '원당동': { lat: 37.6698, lng: 126.8521, level: 5 },
      '향동동': { lat: 37.6001, lng: 126.8988, level: 4 },
      '덕은동': { lat: 37.5852, lng: 126.8831, level: 4 },
      '주교동': { lat: 37.6562, lng: 126.8083, level: 4 },
      '성사동': { lat: 37.6541, lng: 126.8371, level: 4 },
      '신원동': { lat: 37.6685, lng: 126.8872, level: 4 },
      '고양동': { lat: 37.7011, lng: 126.9025, level: 5 },
      '관산동': { lat: 37.6961, lng: 126.8611, level: 5 },
      '도내동': { lat: 37.6322, lng: 126.8621, level: 4 },
      '동산동': { lat: 37.6433, lng: 126.8922, level: 4 },
      '장항동': { lat: 37.6582, lng: 126.7712, level: 4 },
      '정발산동': { lat: 37.6672, lng: 126.7821, level: 4 },
      '백석동': { lat: 37.6421, lng: 126.7882, level: 4 },
      '마두동': { lat: 37.6521, lng: 126.7822, level: 4 },
      '중산동': { lat: 37.6851, lng: 126.7782, level: 4 },
      '식사동': { lat: 37.6781, lng: 126.8121, level: 4 },
      '풍동': { lat: 37.6681, lng: 126.7981, level: 4 },
      '성석동': { lat: 37.6981, lng: 126.7811, level: 5 },
      '가좌동': { lat: 37.6912, lng: 126.7282, level: 4 },
      '주엽동': { lat: 37.6701, lng: 126.7611, level: 4 },
      '대화동': { lat: 37.6761, lng: 126.7481, level: 4 },
      '탄현동': { lat: 37.6941, lng: 126.7631, level: 4 },
      '덕이동': { lat: 37.6981, lng: 126.7421, level: 5 },
      '일산동': { lat: 37.6861, lng: 126.7711, level: 4 },
      '구산동': { lat: 37.7081, lng: 126.7112, level: 5 },
      '법곳동': { lat: 37.6681, lng: 126.7321, level: 5 }
    };

    // 카테고리별 마커 색상 설정 (카페: 분홍색 #FF6B81)
    const categoryColors = {
      '식당': '#4D96FF',
      '카페': '#FF6B81',
      '소품샵': '#FFD93D',
      '서점': '#6BCB77'
    };

    window.onload = function() {
      initMap();
    };

    function initMap() {
      const mapContainer = document.getElementById('map');
      const mapOptions = {
        center: new kakao.maps.LatLng(37.6583599, 126.8320001),
        level: 5
      };

      kakaoMap = new kakao.maps.Map(mapContainer, mapOptions);
      placeSearchService = new kakao.maps.services.Places();
      
      infoWindow = new kakao.maps.InfoWindow({ 
        zIndex: 2,
        removable: true 
      });

      kakao.maps.event.addListener(kakaoMap, 'click', function() {
        infoWindow.close();
      });

      kakao.maps.event.addListener(kakaoMap, 'idle', function() {
        if (!isDistrictChanging) {
          searchPlacesByBounds();
        }
      });

      searchPlaces();
    }

    function createCustomMarkerImage(colorHex) {
      const svgMarker = `
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 24 32">
          <path fill="${colorHex}" stroke="#FFFFFF" stroke-width="1.5" d="M12 0C5.37 0 0 5.37 0 12c0 9 12 20 12 20s12-11 12-20c0-6.63-5.37-12-12-12z"/>
          <circle cx="12" cy="11" r="4.5" fill="#FFFFFF"/>
        </svg>
      `;

      const imageSrc = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgMarker);
      const imageSize = new kakao.maps.Size(30, 40);
      const imageOption = { offset: new kakao.maps.Point(15, 40) };

      return new kakao.maps.MarkerImage(imageSrc, imageSize, imageOption);
    }

    function selectTab(categoryName) {
      currentCategory = categoryName;

      const tabButtons = document.querySelectorAll('.tab-button');
      tabButtons.forEach(button => {
        button.classList.remove('active');
        if (button.textContent === categoryName) {
          button.classList.add('active');
        }
      });

      searchPlaces();
    }

    function handleDistrictChange() {
      searchPlaces();
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        executeSearch();
      }
    }

    function executeSearch() {
      searchPlaces();
    }

    function searchPlaces() {
      const selectedDistrict = document.getElementById('districtSelect').value;
      
      isDistrictChanging = true;
      infoWindow.close();

      if (selectedDistrict !== '전체' && districtCoordinates[selectedDistrict]) {
        const coord = districtCoordinates[selectedDistrict];
        const centerLatLng = new kakao.maps.LatLng(coord.lat, coord.lng);
        kakaoMap.setLevel(coord.level);
        kakaoMap.setCenter(centerLatLng);
      }

      setTimeout(function() {
        isDistrictChanging = false;
        searchPlacesByBounds();
      }, 300);
    }

    function searchPlacesByBounds() {
      const searchInput = document.getElementById('searchInput').value.trim();

      removeMarkers();
      clearPlaceList();
      accumulatedPlaces = [];
      document.getElementById('resultSummary').textContent = '현재 화면에서 장소를 검색 중입니다...';

      let searchKeyword = searchInput !== '' ? `${searchInput} ${currentCategory}` : currentCategory;

      const searchOptions = {
        bounds: kakaoMap.getBounds(),
        useMapBounds: true,
        size: 15
      };

      placeSearchService.keywordSearch(searchKeyword, placesSearchCallback, searchOptions);
    }

    function placesSearchCallback(data, status, pagination) {
      const selectedDistrict = document.getElementById('districtSelect').value;

      if (status === kakao.maps.services.Status.OK && data && data.length > 0) {
        accumulatedPlaces = accumulatedPlaces.concat(data);

        if (pagination.hasNextPage && accumulatedPlaces.length < 45) {
          pagination.nextPage();
          return;
        }
      }

      if (accumulatedPlaces.length > 0) {
        document.getElementById('resultSummary').textContent = `현재 지도 화면 내 ${currentCategory} ${accumulatedPlaces.length}곳 발견`;
        displayPlaceList(accumulatedPlaces);
        displayMarkers(accumulatedPlaces);
      } else {
        document.getElementById('resultSummary').textContent = `현재 지도 화면 내 ${currentCategory} 검색 결과가 없습니다.`;
        clearPlaceList();
        removeMarkers();
      }
    }

    function displayPlaceList(places) {
      const listContainer = document.getElementById('placeList');
      clearPlaceList();

      places.forEach((place, index) => {
        const itemElement = document.createElement('div');
        itemElement.className = 'place-item';
        
        itemElement.innerHTML = `
          <div class="place-title">${index + 1}. ${place.place_name}</div>
          <div class="place-address">${place.road_address_name || place.address_name}</div>
        `;

        itemElement.onclick = function() {
          const moveLatLng = new kakao.maps.LatLng(place.y, place.x);
          kakaoMap.panTo(moveLatLng);
          openInfoWindow(mapMarkers[index], place);
        };

        listContainer.appendChild(itemElement);
      });
    }

    function clearPlaceList() {
      const listContainer = document.getElementById('placeList');
      listContainer.innerHTML = '';
    }

    function displayMarkers(places) {
      const currentColorHex = categoryColors[currentCategory] || '#4D96FF';
      const markerImage = createCustomMarkerImage(currentColorHex);

      places.forEach((place, index) => {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);
        
        const marker = new kakao.maps.Marker({
          position: placePosition,
          image: markerImage,
          map: kakaoMap
        });

        kakao.maps.event.addListener(marker, 'click', function() {
          openInfoWindow(marker, place);
        });

        mapMarkers.push(marker);
      });
    }

    function removeMarkers() {
      mapMarkers.forEach(marker => marker.setMap(null));
      mapMarkers = [];
    }

    function openInfoWindow(marker, place) {
      const address = place.road_address_name || place.address_name;
      const phone = place.phone ? place.phone : '전화번호 정보 없음';
      const placeUrl = place.place_url;

      const content = `
        <div style="padding: 12px; font-size: 12px; line-height: 1.5; min-width: 200px; max-width: 240px; color: #333;">
          <div style="font-weight: bold; font-size: 14px; color: #3c1e1e; margin-bottom: 6px; border-bottom: 1px solid #eee; padding-bottom: 4px;">
            ${place.place_name}
          </div>
          <div style="margin-bottom: 4px; color: #555;">
            📍 ${address}
          </div>
          <div style="margin-bottom: 8px; color: #777; font-size: 11px;">
            📞 ${phone}
          </div>
          <div style="text-align: right;">
            <a href="${placeUrl}" target="_blank" style="display: inline-block; padding: 4px 8px; background-color: #ffeb00; color: #3c1e1e; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 11px;">
              상세보기 ➔
            </a>
          </div>
        </div>
      `;

      infoWindow.setContent(content);
      infoWindow.open(kakaoMap, marker);
    }
  </script>
</body>
</html>
